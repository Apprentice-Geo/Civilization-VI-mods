[package]
name = "civ6-workshop"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dunce = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamworks-sys = "0.13"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
